version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: campusbridge-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: campusbridge
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/database_setup.sql:/docker-entrypoint-initdb.d/setup.sql

  redis:
    image: redis:7-alpine
    container_name: campusbridge-redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campusbridge-backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: password123
      DB_NAME: campusbridge
      DB_PORT: 3306
      JWT_SECRET: campusbridge_super_secret_jwt_key_2026
    depends_on:
      - mysql
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: campusbridge-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mysql_data:
